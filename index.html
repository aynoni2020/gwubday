<!DOCTYPE html>

<html>

<head>
    
    <title>Genevieve's 18th</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    
    <!-- LANDING PAGE-->
    <div id="landing">

        <h1 id="typing"></h1>

        <button id="startBtn">
            <img src="assets/bdayStart.PNG" alt="Start">
        </button>

    </div>


    <!-- PHOTO PAGE -->
    <div id="mems">
        
        <h1 id="clickButtonReminder"></h1>

        <button id="photoButton">
            <img src="assets/cameraButton.PNG">

        </button>

        <div id="photoContainer"></div>
    </div>

    <!-- LETTERS -->
     <div id="letters">

        <h1 id="scrollPrompt"></h1>

        <img id="envQ" class="envelope" src="assets/envQ.PNG">
        <img id="letterQ" class="letterImage" src="assets/letterQ.PNG">

        <img id="envL" class="envelope" src="assets/envL.PNG">
        <img id="letterL" class="letterImage" src="assets/letterL.PNG">

        <img id="envA" class="envelope" src="assets/envA.PNG">
        <img id="letterA" class="letterImage" src="assets/letterA.PNG">

        <h1 id="endMessage">Happy 18th :)</h1>

</div>

    <script src="script.js"></script>

</body>
</html>
